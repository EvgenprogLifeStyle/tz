<details class="faq-item" name="faq" @@open>
  <summary class="faq-item__head">
    <span class="p2 bold">@@question</span>
    <svg class="faq-item__arrow icon icon-20" aria-hidden="true"><use xlink:href="@img/sprite.svg#chevron"></use></svg>
  </summary>
  <div class="faq-item__body">
    <p class="p2 text-muted">@@answer</p>
  </div>
</details>
