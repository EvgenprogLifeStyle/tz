<div class="promo-code">
  <span class="promo-code__label p3 text-muted">Промокод на бонус</span>
  <div class="promo-code__field">
    <span class="promo-code__value">@@code</span>
    <button type="button" class="promo-code__copy" aria-label="Скопировать промокод @@code">
      <svg class="icon icon-20" aria-hidden="true"><use xlink:href="@img/sprite.svg#copy"></use></svg>
      <span class="promo-code__status" aria-live="polite">Копировать</span>
    </button>
  </div>
</div>
